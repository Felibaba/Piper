services:
  - type: web
    name: piper-tts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m piper.download_voices en_US-lessac-medium
    startCommand: python server.py
    healthCheckPath: /voices
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
